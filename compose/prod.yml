# radio zukka v2 — PROD stack
# Usage: docker compose -f compose/prod.yml --env-file env/prod.env up -d
# Images are built/pushed by CI (scripts/build-images.sh) and pinned via
# ZUKKA_TAG (Git SHA); there is no local build path.

name: zukka-prod

x-common: &common
  restart: unless-stopped
  env_file:
    - ${ZUKKA_ENV_FILE:-../env/prod.env}
  logging:
    options:
      max-size: "10m"
      max-file: "3"

services:
  icecast:
    <<: *common
    image: ${ZUKKA_IMAGE_REGISTRY:-ghcr.io/momokli}/zukka-icecast:${ZUKKA_TAG}
    ports:
      - "127.0.0.1:${ZUKKA_PORT_ICECAST:-12000}:8000"
    volumes:
      - icecast_logs:/var/log/icecast
    networks: [front, back]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/status-json.xsl"]
      interval: 10s
      timeout: 3s
      retries: 5

  liquidsoap:
    <<: *common
    image: savonet/liquidsoap:v2.4.5
    # The scheduler image pre-creates /hls and /recordings with uid 65532, so
    # the named volumes are initialised with that owner. Liquidsoap must run as
    # the same uid to write HLS segments and recordings (its default uid 100
    # gets "Permission denied" on /hls).
    user: "65532:65532"
    depends_on:
      scheduler:
        condition: service_healthy
    ports:
      - "0.0.0.0:${ZUKKA_PORT_HARBOR:-12001}:8001"
    volumes:
      - ../liquidsoap:/etc/liquidsoap:ro
      - hls:/hls
      - recordings_staging:/recordings
      - rotation:/rotation:ro
    networks: [front, back, egress]
    command: ["/etc/liquidsoap/radio.liq"]

  scheduler:
    <<: *common
    image: ${ZUKKA_IMAGE_REGISTRY:-ghcr.io/momokli}/zukka-scheduler:${ZUKKA_TAG}
    # The binaries read unprefixed names; the env file only supplies ZUKKA_*.
    # Map them explicitly (D1).
    environment:
      ZUKKA_DB: /data/zukka.db
      ZUKKA_BIND: 0.0.0.0:8080
      # Without RUST_LOG the env filter defaults to `error`, which hides the
      # startup/bootstrap/dispatch lines.
      RUST_LOG: ${RUST_LOG:-info}
      ROTATION_M3U_PATH: /rotation/rotation.m3u
      MUSIC_API_BASE_URL: ${ZUKKA_MUSIC_API_URL}
      LIQUIDSOAP_TOKEN: ${ZUKKA_LIQUIDSOAP_TOKEN}
      SCHEDULER_SERVICE_TOKEN: ${ZUKKA_SCHEDULER_SERVICE_TOKEN}
      ICECAST_STATUS_URL: ${ZUKKA_ICECAST_STATUS_URL}
      # #44: dedicated Prometheus listener (§3.8), scraped via the caddy
      # bridge :12091 (mellon-network).
      ZUKKA_METRICS_BIND: 0.0.0.0:9091
      # Announcements: PROD uses ZUKKA_TELEGRAM_CHAT_ID.
      ZUKKA_ENV: ${ZUKKA_ENV}
      ZUKKA_TELEGRAM_BOT_TOKEN: ${ZUKKA_TELEGRAM_BOT_TOKEN:-}
      ZUKKA_TELEGRAM_CHAT_ID: ${ZUKKA_TELEGRAM_CHAT_ID:-}
      ZUKKA_TELEGRAM_CHAT_ID_TEST: ${ZUKKA_TELEGRAM_CHAT_ID_TEST:-}
      ZUKKA_ANNOUNCEMENT_POLL_SECS: ${ZUKKA_ANNOUNCEMENT_POLL_SECS:-15}
      # #101: first admin, created only when the casters table is empty.
      ZUKKA_BOOTSTRAP_ADMIN_USER: ${ZUKKA_BOOTSTRAP_ADMIN_USER:-}
      ZUKKA_BOOTSTRAP_ADMIN_PASSWORD: ${ZUKKA_BOOTSTRAP_ADMIN_PASSWORD:-}
    ports:
      - "127.0.0.1:${ZUKKA_PORT_SCHEDULER:-12010}:8080"
    expose:
      - "9091"
    volumes:
      - zukka_data:/data
      - recordings_staging:/recordings
      - rotation:/rotation
      - hls:/hls:ro
    networks: [back, egress]
    healthcheck:
      test: ["CMD", "/usr/local/bin/scheduler", "--healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  portal:
    <<: *common
    image: ${ZUKKA_IMAGE_REGISTRY:-ghcr.io/momokli}/zukka-portal:${ZUKKA_TAG}
    environment:
      # PORTAL_BASE_URL is required and must be https (__Host- cookies).
      PORTAL_BASE_URL: https://${ZUKKA_DOMAIN_PORTAL}
      PORTAL_ADDR: 0.0.0.0:8080
      SCHEDULER_BASE_URL: http://scheduler:8080
      SCHEDULER_SERVICE_TOKEN: ${ZUKKA_SCHEDULER_SERVICE_TOKEN}
      MUSIC_API_URL: ${ZUKKA_MUSIC_API_URL}
      MUSIC_API_TOKEN: ${ZUKKA_MUSIC_API_TOKEN}
    volumes:
      - zukka_data:/data:ro
    networks: [front, back, egress]
    depends_on:
      scheduler:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/portal", "--healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  tapes:
    <<: *common
    image: ${ZUKKA_IMAGE_REGISTRY:-ghcr.io/momokli}/zukka-tapes:${ZUKKA_TAG}
    environment:
      DATABASE_PATH: /data/zukka.db
      ZUKKA_BIND: 0.0.0.0:8080
      PUBLIC_BASE_URL: https://${ZUKKA_DOMAIN_TAPES}
      ZUKKA_SCHEDULER_URL: http://scheduler:8080
      SCHEDULER_SERVICE_TOKEN: ${ZUKKA_SCHEDULER_SERVICE_TOKEN}
      MUSIC_API_URL: ${ZUKKA_MUSIC_API_URL}
      MUSIC_API_TOKEN: ${ZUKKA_MUSIC_API_TOKEN}
    volumes:
      - zukka_data:/data:ro
    networks: [front, back, egress]
    depends_on:
      scheduler:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/tapes", "--healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  caddy:
    <<: *common
    image: caddy:2.9
    # PROD: shared edge Caddy in front; no TLS and no admin API here.
    command:
      ["caddy", "run", "--config", "/etc/caddy/Caddyfile.prod", "--adapter", "caddyfile"]
    ports:
      - "127.0.0.1:${ZUKKA_PORT_CADDY:-12080}:12080"
    # #44: expose the metrics bridge :12091 for the shared Prometheus
    # (mellon-network, §3.8).
    expose:
      - "12091"
    volumes:
      - ../deploy/caddy:/etc/caddy:ro
      - caddy_data:/data
      - hls:/srv/hls:ro
      - ../player:/srv/player:ro
    networks: [front, egress, mellon-network]

volumes:
  zukka_data:
  hls:
  recordings_staging:
  rotation:
  caddy_data:
  icecast_logs:

networks:
  front:
  back:
    internal: true
  egress:
  # #44: shared metrics network — only caddy joins it, so the shared
  # Prometheus reaches the metrics bridge :12091 (§3.8).
  mellon-network:
    external: true
