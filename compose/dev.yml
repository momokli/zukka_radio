# radio zukka v2 — DEV stack
# Usage: docker compose -f compose/dev.yml --env-file env/dev.env up -d
# Images are built/pushed by CI (scripts/build-images.sh) and pinned via
# ZUKKA_TAG (Git SHA); there is no local build path.

name: zukka-dev

x-common: &common
  restart: unless-stopped
  env_file:
    - ../env/dev.env
  logging:
    options:
      max-size: "10m"
      max-file: "3"

services:
  icecast:
    <<: *common
    image: ${ZUKKA_IMAGE_REGISTRY:-ghcr.io/momokli}/zukka-icecast:${ZUKKA_TAG}
    ports:
      - "127.0.0.1:${ZUKKA_PORT_ICECAST:-12100}:8000"
    volumes:
      - icecast_logs:/var/log/icecast
    networks: [front, back]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/status-json.xsl"]
      interval: 10s
      timeout: 3s
      retries: 5

  liquidsoap:
    <<: *common
    image: savonet/liquidsoap:v2.4.5
    ports:
      - "127.0.0.1:${ZUKKA_PORT_HARBOR:-12101}:8001"
    volumes:
      - ../liquidsoap:/etc/liquidsoap:ro
      - hls:/hls
      - recordings_staging:/recordings
      - rotation:/rotation:ro
    networks: [front, back, egress]
    command: ["/etc/liquidsoap/radio.liq"]

  scheduler:
    <<: *common
    image: ${ZUKKA_IMAGE_REGISTRY:-ghcr.io/momokli}/zukka-scheduler:${ZUKKA_TAG}
    ports:
      - "127.0.0.1:${ZUKKA_PORT_SCHEDULER:-12110}:8080"
    volumes:
      - zukka_data:/data
      - recordings_staging:/recordings
      - rotation:/rotation
      - hls:/hls:ro
    networks: [back, egress]
    healthcheck:
      test: ["CMD", "/usr/local/bin/scheduler", "--healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  portal:
    <<: *common
    image: ${ZUKKA_IMAGE_REGISTRY:-ghcr.io/momokli}/zukka-portal:${ZUKKA_TAG}
    volumes:
      - zukka_data:/data:ro
    networks: [front, back, egress]
    healthcheck:
      test: ["CMD", "/usr/local/bin/portal", "--healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  tapes:
    <<: *common
    image: ${ZUKKA_IMAGE_REGISTRY:-ghcr.io/momokli}/zukka-tapes:${ZUKKA_TAG}
    volumes:
      - zukka_data:/data:ro
    networks: [front, back, egress]
    healthcheck:
      test: ["CMD", "/usr/local/bin/tapes", "--healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  caddy:
    <<: *common
    image: caddy:2.9
    command:
      ["caddy", "run", "--config", "/etc/caddy/Caddyfile.dev", "--adapter", "caddyfile"]
    ports:
      - "127.0.0.1:${ZUKKA_PORT_CADDY:-12180}:12080"
      - "127.0.0.1:${ZUKKA_PORT_CADDY_TLS:-12181}:2019"
    volumes:
      - ../deploy/caddy:/etc/caddy:ro
      - caddy_data:/data
      - hls:/srv/hls:ro
    networks: [front, egress]

volumes:
  zukka_data:
  hls:
  recordings_staging:
  rotation:
  caddy_data:
  icecast_logs:

networks:
  front:
  back:
    internal: true
  egress:
