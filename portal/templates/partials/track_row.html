<tr id="track-{{ track.id }}">
  <td><a href="/library/tracks/{{ track.id }}">{{ track.title }}</a></td>
  <td>{{ track.artist }}</td>
  <td><span class="badge badge-{{ track.visibility }}">{{ track.visibility }}</span></td>
  <td>
    <form
      method="post"
      action="/library/tracks/{{ track.id }}/visibility"
      hx-post="/library/tracks/{{ track.id }}/visibility"
      hx-target="#track-{{ track.id }}"
      hx-swap="outerHTML"
      class="inline"
    >
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
      <select name="visibility" aria-label="Sichtbarkeit">
        <option value="shared" {% if track.visibility == "shared" %}selected{% endif %}>shared</option>
        <option value="private" {% if track.visibility == "private" %}selected{% endif %}>private</option>
      </select>
      <button type="submit">Setzen</button>
    </form>
  </td>
  <td>
    {% if can_delete %}
    <form
      method="post"
      action="/library/tracks/{{ track.id }}/delete"
      hx-post="/library/tracks/{{ track.id }}/delete"
      hx-target="#track-{{ track.id }}"
      hx-swap="outerHTML"
      hx-confirm="Track wirklich löschen?"
      class="inline"
    >
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
      <button type="submit">Löschen</button>
    </form>
    {% endif %}
  </td>
</tr>
