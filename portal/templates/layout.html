<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="csrf-token" content="{{ csrf_token }}" />
    <title>{% block title %}zukka{% endblock %} · zukka radio</title>
    <link rel="stylesheet" href="/static/app.css" />
    <script src="/static/htmx.min.js" defer></script>
    <script src="/static/htmx-ext-sse.js" defer></script>
    <script src="/static/sortable.min.js" defer></script>
    <script src="/static/waveform.js" defer></script>
  </head>
  <body hx-headers='{"X-CSRF-Token": "{{ csrf_token }}"}'>
    <header class="topbar">
      <a class="brand" href="/">zukka&nbsp;radio</a>
      <nav class="nav">
        <a href="/">Dashboard</a>
        <a href="/library">Library</a>
        <a href="/queues">Queues</a>
        <a href="/control">Control</a>
        <a href="/shows">Shows</a>
        <a href="/schedule">Kalender</a>
        <a href="/account">Konto</a>
      </nav>
    </header>
    <main class="content">
      {% block content %}{% endblock %}
    </main>
    <div id="toast" class="toast" hidden></div>
    <footer class="footer">
      <span>portal · thin UI over the scheduler identity authority</span>
    </footer>
    <script>
      // Toast sink for the HX-Trigger `toast` event (Issue #20/#22). Renders
      // an optional "Rückgängig" button (10 s) that re-posts the previous
      // control values as an htmx request (Issue #22 US-5, K5).
      (function () {
        var CSRF = (function () {
          var meta = document.querySelector('meta[name="csrf-token"]');
          return meta ? meta.getAttribute("content") : "";
        })();

        function clearToast(el) {
          el.hidden = true;
          el.textContent = "";
        }

        function showToast(evt) {
          var detail = (evt && evt.detail) || {};
          var el = document.getElementById("toast");
          if (!el) return;
          clearToast(el);
          el.className = "toast toast-" + (detail.level || "info");
          el.hidden = false;
          var span = document.createElement("span");
          span.textContent = detail.message || "";
          el.appendChild(span);

          if (detail.undo) {
            var btn = document.createElement("button");
            btn.type = "button";
            btn.className = "ghost toast-undo";
            btn.textContent = "Rückgängig";
            btn.addEventListener("click", function () {
              var values = Object.assign({ csrf_token: CSRF }, detail.undo);
              window.htmx.ajax("POST", "/control/source", {
                target: "#control-state",
                swap: "outerHTML",
                values: values,
              });
              clearToast(el);
            });
            el.appendChild(btn);
          }

          window.clearTimeout(el._timer);
          el._timer = window.setTimeout(function () {
            clearToast(el);
          }, detail.undo ? 10000 : 4000);
        }
        document.body.addEventListener("toast", showToast);
      })();

      // Drag-and-drop reorder (SortableJS) → the same `move` endpoint as the
      // no-JS ↑/↓ buttons, so both paths yield the same DB state (D18).
      (function () {
        function initQueueSortable() {
          var el = document.getElementById("queue-items");
          if (!el || !window.Sortable || el.dataset.canWrite !== "true") return;
          if (el._sortable) el._sortable.destroy();
          el._sortable = window.Sortable.create(el, {
            animation: 150,
            onEnd: function (evt) {
              var list = evt.to;
              var ids = Array.prototype.map
                .call(list.children, function (li) {
                  return li.dataset.itemId;
                })
                .filter(Boolean);
              var moved = ids[evt.newIndex];
              if (!moved) return;
              var values;
              if (evt.newIndex === 0) {
                values = { before_id: ids[1] || "", version: list.dataset.version };
              } else {
                values = { after_id: ids[evt.newIndex - 1], version: list.dataset.version };
              }
              window.htmx.ajax(
                "POST",
                "/queues/" + list.dataset.queueId + "/items/" + moved + "/move",
                { target: "#queue-items", swap: "outerHTML", values: values }
              );
            },
          });
        }
        document.addEventListener("DOMContentLoaded", initQueueSortable);
        document.addEventListener("htmx:afterSwap", initQueueSortable);
      })();
    </script>
  </body>
</html>
