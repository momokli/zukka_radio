# Runner-Profil — radio zukka v2 (Runner A/B).
#
# Wird von scripts/runner-profile.sh gesourct. NUR Defaults: `:=` überschreibt
# keine bereits gesetzte Umgebungsvariable.

# Repo + Identität.
: "${RUNNER_REPO:=momokli/zukka_radio}"
: "${RUNNER_STATE_PREFIX:=zukka}"
: "${RUNNER_A_GH:=clanker-gh}"        # Runner A = momo-clanker[bot]
: "${RUNNER_B_GH:=claw-gh}"           # Runner B = momo-claw[bot]

# Basis-Branch: die neue Welt liegt auf `v2`, nicht auf `main`.
: "${RUNNER_BASE_BRANCH:=v2}"

# v2 hat keinen Release-Pfad: freigegebene Milestones werden direkt geschlossen,
# sobald sie code-complete sind (0 offene Issues).
: "${RUNNER_CLOSE_APPROVED:=1}"

# Automation-Jobs (Trigger-Ziel + Dedup-Key).
: "${RUNNER_TRIAGE_KEY:=zukka-triage:v2}"
: "${RUNNER_GATE_KEY:=zukka-pr-gate:v2}"
: "${RUNNER_TICK_LOG:=/srv/openclaw/logs/zukka-tick.log}"

# Fokus-Milestone: der freigegebene offene Milestone (Freigabe: ja).
# Titel-Muster: M0 — Foundation, M1 — Scheduler Core, …
: "${RUNNER_FOCUS_PATTERN:=^M[0-9]}"
: "${RUNNER_APPROVE_RE:=(?im)^[ \t]*freigabe[ \t]*:[ \t]*(ja|yes|true)[ \t]*$}"

# Labels (Zustandsmaschine).
: "${RUNNER_DISPATCH_LABEL:=orchestrator:dispatched}"
: "${RUNNER_REDISPATCH_LABEL:=triage:redispatch}"
: "${RUNNER_BLOCKED_LABEL:=question}"
: "${RUNNER_RELEASE_LABEL:=release:auto}"
# v2 nutzt Milestones statt Versionen: kein Release-Tracking-Issue.
: "${RUNNER_RELEASE_TRACKING_ISSUE:=0}"
: "${RUNNER_HOLD_LABELS:=claimed needs:manual-test follow-up hold question triage:no-action}"
: "${RUNNER_MANUAL_TEST_LABEL:=needs:manual-test}"

# Worker-Orchestratoren (Stale-Guard liest deren Sessions).
: "${RUNNER_WORKER_AGENTS:=coding-orchestrator planning-orchestrator}"

# Kein Release-Flow in v2 (Milestones sind die Einheit, nicht Versionen).
: "${RUNNER_RELEASE_HINT:=v2 hat keinen Release-Flow. Der Fokus-Milestone ist fertig, wenn alle Leaf-Issues geschlossen und alle PRs gemergt sind.}"
