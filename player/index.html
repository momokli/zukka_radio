<!doctype html>
<html lang="de">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <meta property="og:title" content="radio zukka" />
        <meta name="theme-color" content="#0d1117" />
        <title>radio zukka</title>
        <link
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
            rel="stylesheet"
        />
        <link
            href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=VT323&display=swap"
            rel="stylesheet"
        />
        <style>
            body {
                background: url(/bg.jpg) center/cover fixed;
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;
                padding-top: 18vh;
                margin: 0;
                overflow: hidden;
                box-sizing: border-box;
            }
            .azuracast-widget {
                display: flex;
                flex-direction: column;
                align-items: center;
                width: 100%;
                max-width: 600px;
                margin: 0 auto;
                font-family: sans-serif;
                position: relative;
            }
            .azuracast-widget * {
                box-sizing: border-box;
            }
            .azuracast-widget .cassette-container {
                position: relative;
                width: 100%;
                aspect-ratio: 600/380;
                background-image: url(/cassette_frame.png);
                background-size: 100% 100%;
                background-repeat: no-repeat;
                border-radius: 15px;
                font-family: "Permanent Marker", cursive;
            }
            .azuracast-widget .cassette-container.spinning {
                background-image: url(/cassette.gif);
            }
            .azuracast-widget .label-area {
                position: absolute;
                top: 13%;
                left: 21%;
                width: 69%;
                height: 25%;
                display: flex;
                flex-direction: column;
                justify-content: flex-start;
                color: #1a2f4c;
            }
            .azuracast-widget .title-row {
                display: flex;
                align-items: flex-start;
                width: 100%;
                margin-bottom: 2px;
            }
            .azuracast-widget .status-badge {
                font-family: "VT323", monospace;
                background-color: #ff3333;
                color: white;
                padding: 0 6px;
                border-radius: 3px;
                font-size: clamp(0.7rem, 2vw, 1.1rem);
                display: inline-block;
                text-transform: uppercase;
                box-shadow: 1px 1px 0 rgba(0, 0, 0, 0.3);
                z-index: 10;
                flex-shrink: 0;
                margin-left: -15.5%;
                margin-right: 12px;
                margin-top: 6px;
                min-width: 4ch;
                text-align: center;
            }
            .azuracast-widget .status-badge.rec {
                background-color: #4caf50;
            }
            .azuracast-widget .status-badge.live {
                background-color: #4caf50;
            }
            .azuracast-widget .track-title {
                font-size: clamp(0.55rem, 1.5vw, 0.85rem);
                line-height: 1.1;
                display: -webkit-box;
                -webkit-line-clamp: 2;
                -webkit-box-orient: vertical;
                overflow: hidden;
                flex-grow: 1;
                margin-top: -2px;
            }
            .azuracast-widget .track-artist {
                font-size: clamp(0.6rem, 1.5vw, 0.9rem);
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
                width: 100%;
                opacity: 0.8;
                margin-left: -16%;
            }
            .azuracast-widget .on-cassette-controls {
                position: absolute;
                bottom: 12%;
                left: 0;
                width: 100%;
                display: flex;
                justify-content: center;
                align-items: center;
                gap: 8px;
                z-index: 20;
            }
            .azuracast-widget .btn {
                box-sizing: border-box;
                height: 34px;
                background-color: rgba(209, 213, 219, 0.9);
                border: 2px solid #9ca3af;
                border-bottom: 4px solid #6b7280;
                border-radius: 5px;
                padding: 4px 10px;
                color: #374151;
                font-weight: 700;
                cursor: pointer;
                display: flex;
                align-items: center;
                gap: 6px;
                text-decoration: none;
                font-size: clamp(0.6rem, 1.5vw, 0.8rem);
                transition: background-color 0.1s;
            }
            .azuracast-widget .btn:active {
                transform: translateY(2px);
                border-bottom: 2px solid #6b7280;
            }
            .azuracast-widget .btn:hover {
                background-color: #e5e7eb;
            }
            .azuracast-widget #ac-play-btn {
                width: 80px;
                justify-content: center;
            }
            .azuracast-widget .volume-control {
                background-color: rgba(209, 213, 219, 0.9);
                border: 2px solid #9ca3af;
                border-bottom: 4px solid #6b7280;
                border-radius: 5px;
                padding: 4px 10px;
                display: flex;
                align-items: center;
                gap: 6px;
                box-sizing: border-box;
                height: 34px;
            }
            .azuracast-widget .volume-control i {
                color: #374151;
                font-size: clamp(0.6rem, 1.5vw, 0.8rem);
                cursor: pointer;
                width: 14px;
                text-align: center;
            }
            .azuracast-widget .volume-slider {
                -webkit-appearance: none;
                width: 60px;
                background: transparent;
                margin: 0;
            }
            .azuracast-widget .volume-slider:focus {
                outline: none;
            }
            .azuracast-widget .volume-slider::-webkit-slider-runnable-track {
                width: 100%;
                height: 4px;
                cursor: pointer;
                background: #4b5563;
                border-radius: 2px;
                box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.5);
            }
            .azuracast-widget .volume-slider::-webkit-slider-thumb {
                height: 12px;
                width: 8px;
                border-radius: 2px;
                background: #f3f4f6;
                cursor: pointer;
                -webkit-appearance: none;
                margin-top: -4px;
                box-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
                border: 1px solid #9ca3af;
            }
            .azuracast-widget .listeners-count {
                position: absolute;
                top: 46%;
                right: 12%;
                transform: translateY(-50%);
                text-align: center;
                font-size: clamp(1rem, 2vw, 0.85rem);
                color: rgba(255, 255, 255, 0.9);
                font-family: "VT323", monospace;
                background-color: rgba(0, 0, 0, 0.6);
                padding: 2px 6px;
                border-radius: 4px;
                text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
                z-index: 20;
            }
            .azuracast-widget .listeners-count i {
                margin-right: 4px;
                color: #ff3333;
            }
        </style>
    </head>
    <body>
        <div class="azuracast-widget">
            <audio id="ac-audio-player" preload="none"></audio>
            <div class="cassette-container">
                <div class="label-area">
                    <div class="title-row">
                        <div id="ac-status-badge" class="status-badge rec">REC</div>
                        <div class="track-title" id="ac-track-title">radio zukka</div>
                    </div>
                    <div class="track-artist" id="ac-track-artist"></div>
                </div>
                <div class="on-cassette-controls">
                    <div class="volume-control">
                        <i
                            class="fas fa-volume-up"
                            id="ac-volume-icon"
                            onclick="acToggleMute()"
                            title="Mute/Unmute"
                        ></i>
                        <input
                            type="range"
                            id="ac-volume-slider"
                            class="volume-slider"
                            min="0"
                            max="1"
                            step="0.01"
                            value="0.8"
                        />
                    </div>
                    <button class="btn" id="ac-play-btn" onclick="acTogglePlay()">
                        <i class="fas fa-play"></i> PLAY
                    </button>
                    <a href="https://tapes.dev.zukkafabrik.de" target="_blank" class="btn"
                        ><i class="fas fa-archive"></i> recordings</a
                    >
                </div>
                <div class="listeners-count">
                    <i class="fas fa-headphones"></i><span id="ac-listener-count">0</span>
                </div>
            </div>
        </div>

        <script>
            const acAudio = document.getElementById("ac-audio-player"),
                acPlayBtn = document.getElementById("ac-play-btn");
            const acVolumeSlider = document.getElementById("ac-volume-slider"),
                acVolumeIcon = document.getElementById("ac-volume-icon");
            const badge = document.getElementById("ac-status-badge"),
                titleEl = document.getElementById("ac-track-title");
            const artistEl = document.getElementById("ac-track-artist"),
                listeners = document.getElementById("ac-listener-count");
            // v2 has a single MP3 stream and no public nowplaying API yet.
            let acIsPlaying = false,
                acPreviousVolume = 0.8;
            acAudio.volume = acVolumeSlider.value;

            // v2: one MP3 stream (192k), served by the stack Caddy.
            acAudio.src = "/stream.mp3";

            function acTogglePlay() {
                if (acIsPlaying) {
                    acAudio.pause();
                    acAudio.currentTime = 0;
                    acIsPlaying = false;
                    acPlayBtn.innerHTML = '<i class="fas fa-play"></i> PLAY';
                    document
                        .querySelector(".cassette-container")
                        .classList.remove("spinning");
                } else {
                    acIsPlaying = true;
                    acPlayBtn.innerHTML = '<i class="fas fa-stop"></i> STOP';
                    acAudio.play();
                    document
                        .querySelector(".cassette-container")
                        .classList.add("spinning");
                }
            }

            acVolumeSlider.addEventListener("input", (e) => {
                const v = parseFloat(e.target.value);
                acAudio.volume = v;
                acUpdateVolumeIcon(v);
            });

            function acToggleMute() {
                if (acAudio.volume > 0) {
                    acPreviousVolume = acAudio.volume;
                    acAudio.volume = 0;
                    acVolumeSlider.value = 0;
                    acUpdateVolumeIcon(0);
                } else {
                    acAudio.volume = acPreviousVolume;
                    acVolumeSlider.value = acPreviousVolume;
                    acUpdateVolumeIcon(acPreviousVolume);
                }
            }

            function acUpdateVolumeIcon(v) {
                acVolumeIcon.className = "fas";
                if (v === 0) acVolumeIcon.classList.add("fa-volume-mute");
                else if (v < 0.5) acVolumeIcon.classList.add("fa-volume-down");
                else acVolumeIcon.classList.add("fa-volume-up");
            }

            // Static fallback until the first successful poll (Issue #107).
            badge.className = "status-badge rec";
            badge.textContent = "REC";
            titleEl.textContent = "radio zukka";

            // Public now-playing: same-origin projection served by tapes,
            // polled every ~10s. A scheduler outage degrades to live:false
            // with null fields; on error we keep the last known state.
            const AC_NOWPLAYING_URL = "/api/v1/public/nowplaying";
            let acNowPlayingInflight = false;

            function acApplyNowPlaying(np) {
                if (!np || typeof np !== "object") return;
                const show = (np.show || "").trim();
                const title = (np.title || "").trim() || show || "radio zukka";
                const artist = (np.artist || "").trim();

                if (np.live === true) {
                    badge.className = "status-badge live";
                    badge.textContent = "LIVE";
                } else if (show) {
                    badge.className = "status-badge rec";
                    badge.textContent = show;
                } else {
                    badge.className = "status-badge rec";
                    badge.textContent = "REC";
                }
                titleEl.textContent = title;
                artistEl.textContent = artist;
            }

            async function acPollNowPlaying() {
                if (acNowPlayingInflight || document.hidden) return;
                acNowPlayingInflight = true;
                const controller = new AbortController();
                const timer = setTimeout(() => controller.abort(), 5000);
                try {
                    const res = await fetch(AC_NOWPLAYING_URL, {
                        signal: controller.signal,
                        cache: "no-store",
                    });
                    if (!res.ok) throw new Error("nowplaying " + res.status);
                    acApplyNowPlaying(await res.json());
                } catch (e) {
                    // Keep the last known state (initial static fallback stays).
                } finally {
                    clearTimeout(timer);
                    acNowPlayingInflight = false;
                }
            }

            acPollNowPlaying();
            setInterval(acPollNowPlaying, 10000);
        </script>
    </body>
</html>
