name: deploy-dev

# Push auf v2 → ci grün → automatischer DEV-Deploy + Smoke.
#
# Läuft auf dem Self-hosted Runner `planet-zukka` direkt auf dem Deploy-Host:
# kein SSH, kein ufw-Rate-Limit, kein Deploy-Secret. Der Runner ist Mitglied
# der Gruppe `momo` (Schreibzugriff auf /srv/zukka-dev/repo) und der Gruppe
# `docker`.
#
# Stream-Schutz: scheduler/portal/tapes werden immer neu erstellt. Caddy,
# Icecast und Liquidsoap nur, wenn niemand auf dem DEV-Stream hört — ein
# Recreate würde die Hörer trennen.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [v2]

concurrency:
  group: deploy-dev
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, zukka]
    environment: dev
    timeout-minutes: 45
    steps:
      - name: Sync DEV checkout
        run: |
          cd /srv/zukka-dev/repo
          git fetch --prune origin
          git reset --hard "${{ github.event.workflow_run.head_sha }}"

      - name: Build images
        run: |
          cd /srv/zukka-dev/repo
          SHA="${{ github.event.workflow_run.head_sha }}"
          docker build -f scheduler/Dockerfile      -t "ghcr.io/momokli/zukka-scheduler:$SHA" .
          docker build -f portal/Dockerfile         -t "ghcr.io/momokli/zukka-portal:$SHA" .
          docker build -f tapes/Dockerfile          -t "ghcr.io/momokli/zukka-tapes:$SHA" .
          docker build -f deploy/icecast/Dockerfile -t "ghcr.io/momokli/zukka-icecast:$SHA" .

      - name: Deploy app services
        run: |
          cd /srv/zukka-dev/repo
          sed -i "s|^ZUKKA_TAG=.*|ZUKKA_TAG=${{ github.event.workflow_run.head_sha }}|" env/dev.env
          docker compose -f compose/dev.yml --env-file env/dev.env up -d --wait \
            scheduler portal tapes

      - name: Deploy stream stack (only when idle)
        run: |
          cd /srv/zukka-dev/repo
          listeners=$(curl -fsS http://127.0.0.1:12100/status-json.xsl \
            | python3 -c 'import sys,json; s=json.load(sys.stdin)["icestats"].get("source"); s=s if isinstance(s,list) else ([s] if s else []); print(sum(int(x.get("listeners",0)) for x in s))')
          echo "DEV listeners: $listeners"
          if [ "$listeners" -eq 0 ]; then
            docker compose -f compose/dev.yml --env-file env/dev.env up -d --wait \
              caddy icecast liquidsoap
          else
            echo "::warning::stream stack not recreated — $listeners listener(s) active"
          fi

      - name: Smoke (dev)
        run: /srv/zukka-dev/repo/scripts/smoke.sh dev

      - name: Logs on failure
        if: failure()
        run: cd /srv/zukka-dev/repo && docker compose -f compose/dev.yml logs --no-color --tail 120
