name: deploy-dev

# Push auf v2 → ci grün → automatischer DEV-Deploy + Smoke.
#
# Läuft auf dem Self-hosted Runner `planet-zukka` direkt auf dem Deploy-Host:
# kein SSH, kein ufw-Rate-Limit, kein Deploy-Secret. Der Runner ist Mitglied
# der Gruppe `momo` (Schreibzugriff auf /srv/zukka-dev/repo) und der Gruppe
# `docker`.
#
# Stream-Schutz gibt es hier bewusst nicht: DEV ist Testumgebung, ein
# Deploy darf alles neu erstellen. Der Hörer-Gate gehört in den PROD-Pfad
# (`zukka-deploy prod --check-window`).
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [v2]

concurrency:
  group: deploy-dev
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, zukka]
    environment: dev
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - name: Sync DEV checkout
        run: |
          cd /srv/zukka-dev/repo
          git fetch --prune origin
          git reset --hard "${{ github.event.workflow_run.head_sha }}"

      - name: Pull images from GHCR
        run: |
          # The `ci` workflow's build job already pushed these tags; rebuilding
          # them here would double the pipeline time.
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          SHA="${{ github.event.workflow_run.head_sha }}"
          docker pull "ghcr.io/momokli/zukka-scheduler:$SHA"
          docker pull "ghcr.io/momokli/zukka-portal:$SHA"
          docker pull "ghcr.io/momokli/zukka-tapes:$SHA"
          docker pull "ghcr.io/momokli/zukka-icecast:$SHA"

      - name: Deploy (dev)
        run: |
          cd /srv/zukka-dev/repo
          sed -i "s|^ZUKKA_TAG=.*|ZUKKA_TAG=${{ github.event.workflow_run.head_sha }}|" env/dev.env
          docker compose -f compose/dev.yml --env-file env/dev.env up -d --wait

      - name: Smoke (dev)
        run: /srv/zukka-dev/repo/scripts/smoke.sh dev

      - name: Logs on failure
        if: failure()
        run: cd /srv/zukka-dev/repo && docker compose -f compose/dev.yml logs --no-color --tail 120
