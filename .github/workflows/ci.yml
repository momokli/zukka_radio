name: ci

on:
  push:
    branches: [v2]
  pull_request:
    branches: [v2]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: test
        run: cargo test --workspace

      - name: node assets tests
        run: node --test tapes/assets/peaks.test.mjs tapes/assets/player.test.mjs

      - name: sqlx migrate info
        env:
          DATABASE_URL: sqlite:/tmp/zukka-ci.db
        run: |
          cargo install sqlx-cli --no-default-features --features sqlite --locked
          sqlx database create
          sqlx migrate info --source scheduler/migrations

  liquidsoap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: syntax check
        run: |
          docker run --rm -v "$PWD/liquidsoap:/etc/liquidsoap:ro" \
            savonet/liquidsoap:v2.4.5 \
            liquidsoap --check /etc/liquidsoap/radio.liq

      - name: fcfs registry test
        run: |
          docker run --rm -e ZUKKA_HARBOR_SLOTS=0 \
            -v "$PWD/liquidsoap:/etc/liquidsoap:ro" \
            savonet/liquidsoap:v2.4.5 \
            liquidsoap /etc/liquidsoap/tests/live_fcfs_test.liq

  caddy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: validate dev
        run: |
          docker run --rm \
            --env-file env/dev.env.example \
            -v "$PWD/deploy/caddy:/cfg:ro" \
            caddy:2.9 caddy validate --config /cfg/Caddyfile.dev --adapter caddyfile

      - name: validate prod
        run: |
          docker run --rm \
            --env-file env/prod.env.example \
            -v "$PWD/deploy/caddy:/cfg:ro" \
            caddy:2.9 caddy validate --config /cfg/Caddyfile.prod --adapter caddyfile

      - name: validate prod-own (cloudflare module)
        run: |
          docker run --rm \
            --env-file env/prod.env.example \
            -v "$PWD/deploy/caddy:/cfg:ro" \
            ghcr.io/caddybuilds/caddy-cloudflare:2.9.1 \
            caddy validate --config /cfg/Caddyfile.prod-own --adapter caddyfile

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 \
            detect --source /repo --verbose

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck
        run: |
          shellcheck -S warning \
            deploy/announce/*.sh \
            scripts/*.sh \
            deploy/systemd/zukka-deploy \
            deploy/systemd/zukka-backup

  backup:
    # End-to-end backup/restore-drill against a LOCAL restic repo (#43).
    # Proves backup -> drill -> prune plus the negative cases; no PROD access.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install restic and sqlite3
        run: sudo apt-get update && sudo apt-get install -y restic sqlite3

      - name: backup drill test
        run: ./scripts/zukka-backup-test.sh

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: validate
        run: |
          cp env/dev.env.example env/dev.env
          cp env/prod.env.example env/prod.env
          docker compose -f compose/dev.yml --env-file env/dev.env config -q
          docker compose -f compose/prod.yml --env-file env/prod.env config -q

  build:
    # Push-only: PRs never build or push images. Runs after every CI gate.
    needs: [rust, liquidsoap, caddy, secrets, shellcheck, compose, backup]
    if: github.event_name == 'push' && github.ref == 'refs/heads/v2'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build and push images
        run: ./scripts/build-images.sh "${{ github.sha }}"
