name: deploy-prod

# PROD deploy: annotated/lightweight release tags `v*` or manual dispatch.
# The `prod` environment carries the Required Reviewer gate; PROD deploys never
# run unattended on a plain branch push.
#
# NOT in scope here:
#   - pre-deploy backup (#43): happens inside the wrapper.
# The audience/deploy-window gate (#42) runs as an explicit step before the
# deploy: `zukka-deploy prod --check-window` (GET /internal/ops/audience).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Ref/Tag/SHA to deploy (empty = tagged ref on push, github.sha on dispatch)"
        type: string
        required: false
        default: ""
      force:
        description: "Override the audience/window gate and restart liquidsoap/icecast (audible, max 1x/day)"
        type: boolean
        required: false
        default: false
      rollback:
        description: "Redeploy the tag from .deployed.prev instead of the given tag"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  release:
    # Only a tag push creates a GitHub Release; manual dispatch never does.
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag commit is an ancestor of origin/v2
        run: |
          set -euo pipefail
          git fetch origin v2 --no-tags
          git merge-base --is-ancestor "$GITHUB_SHA" origin/v2

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release ${tag} already exists"
            exit 0
          fi
          # `%(contents)` is the annotated tag message; for lightweight tags it
          # prints the tagged commit's message (not empty in practice). The
          # fallback therefore only fires when the result is truly empty.
          notes="$(git tag -l --format='%(contents)' "$tag")"
          gh release create "$tag" \
            --verify-tag \
            --title "$tag" \
            --notes "${notes:-Release ${tag}}"

  deploy:
    needs: [release]
    # `release` is skipped on workflow_dispatch; run regardless in that case.
    if: always() && (needs.release.result == 'success' || needs.release.result == 'skipped')
    runs-on: ubuntu-24.04
    environment: prod
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve deploy SHA
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          GITHUB_SHA_VALUE: ${{ github.sha }}
        run: |
          set -euo pipefail
          target="${INPUT_TAG:-}"
          if [[ -z "$target" ]]; then
            target="$GITHUB_SHA_VALUE"
          fi
          if [[ "$target" =~ ^[0-9a-f]{7,40}$ ]]; then
            sha="$target"
          else
            git fetch --tags --force
            sha="$(git rev-parse "${target}^{commit}")"
          fi
          if [[ ! "$sha" =~ ^[0-9a-f]{7,40}$ ]]; then
            echo "could not resolve '${target}' to a commit" >&2
            exit 1
          fi
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

      # A manual dispatch can name any tag/SHA; require it to be part of v2.
      - name: Verify deploy SHA is an ancestor of origin/v2
        if: ${{ !inputs.rollback }}
        env:
          SHA: ${{ steps.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch origin v2 --no-tags
          git merge-base --is-ancestor "$SHA" origin/v2

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/deploy"
          chmod 600 "$HOME/.ssh/deploy"
          if [[ -n "${DEPLOY_KNOWN_HOSTS:-}" ]]; then
            printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          else
            # TOFU fallback: pin the host key on first use. Prefer setting the
            # `DEPLOY_KNOWN_HOSTS` secret (see docs/deploy-prod.md).
            ssh-keyscan -H cast.zukkafabrik.de >> "$HOME/.ssh/known_hosts"
          fi
          chmod 600 "$HOME/.ssh/known_hosts"

      # Audience/deploy-window gate (#42): before any PROD change, ask the
      # scheduler whether it is quiet. Exit 3 = gate closed (listeners live or
      # outside 03:00–04:00 Europe/Berlin); everything else propagates as-is.
      - name: Audience-Gate (prod)
        if: ${{ !inputs.rollback }}
        env:
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          args=(prod --check-window)
          if [[ "$FORCE" == "true" ]]; then
            args+=(--force)
          fi
          printf -v quoted '%q ' "${args[@]}"
          # Capture the exit code without `-e` aborting on the non-zero gate.
          set +e
          ssh -i "$HOME/.ssh/deploy" -o StrictHostKeyChecking=yes \
            zukka-deploy@cast.zukkafabrik.de \
            "sudo /usr/local/bin/zukka-deploy ${quoted}"
          rc=$?
          set -e
          if [[ "$rc" -eq 3 ]]; then
            echo "::error::Audience-/Fenster-Gate zu: Hörer/live_sources aktiv oder außerhalb 03:00–04:00 Europe/Berlin. Override: workflow_dispatch mit force=true."
            exit 3
          fi
          if [[ "$rc" -ne 0 ]]; then
            echo "::error::Audience-Gate-Aufruf fehlgeschlagen (ssh/zukka-deploy exit ${rc})."
            exit "$rc"
          fi
          echo "Audience-Gate offen — Deploy darf starten."

      - name: Deploy (prod)
        if: ${{ !inputs.rollback }}
        env:
          SHA: ${{ steps.resolve.outputs.sha }}
          FORCE: ${{ inputs.force }}
          GIT_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          # `github.ref` is attacker-influenced on tag pushes: git refnames may
          # contain `;`, `&`, `|`, `$`, backticks, `(`, `)` (e.g. a tag `v1;id`
          # is valid). Reject anything that is not a plain heads/tags ref before
          # it reaches the remote shell (see zukka-deploy REF_RE too).
          if [[ ! "$GIT_REF" =~ ^refs/(heads|tags)/[A-Za-z0-9._/-]+$ ]]; then
            echo "refusing unsafe ref '${GIT_REF}' (expected ^refs/(heads|tags)/[A-Za-z0-9._/-]+$)" >&2
            exit 1
          fi
          args=(prod --tag "$SHA")
          if [[ "$FORCE" == "true" ]]; then
            args+=(--force)
          fi
          args+=(--ref "$GIT_REF")
          # Belt-and-braces on top of the regex: shell-quote every argument so
          # it is passed as a single literal word to the remote shell.
          printf -v quoted_args '%q ' "${args[@]}"
          ssh -i "$HOME/.ssh/deploy" -o StrictHostKeyChecking=yes \
            zukka-deploy@cast.zukkafabrik.de \
            "sudo /usr/local/bin/zukka-deploy ${quoted_args}"

      - name: Rollback (prod)
        if: ${{ inputs.rollback }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/deploy" -o StrictHostKeyChecking=yes \
            zukka-deploy@cast.zukkafabrik.de \
            "sudo /usr/local/bin/zukka-deploy prod --rollback"

      # Smoke runs from the host checkout: the PROD control-plane/Caddy path is
      # loopback-only. The Harbor raw-TCP fallback (liquidsoap 0.0.0.0:12001,
      # infrastructure.md §2.2) is intentionally public and not covered here.
      - name: Smoke (prod)
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/deploy" -o StrictHostKeyChecking=yes \
            zukka-deploy@cast.zukkafabrik.de \
            "/opt/apps/radio-zukka/repo/scripts/smoke.sh prod"
