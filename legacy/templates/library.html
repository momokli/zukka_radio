<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DJ Library — Zukka Radio</title>
  <link rel="stylesheet" href="/static/style.css">
  <style>
    .dj-tabs { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
    .dj-tab {
      padding: 0.5rem 1.2rem; border: 1px solid #30363d; border-radius: 6px;
      background: #21262d; color: #c9d1d9; text-decoration: none; font-size: 0.9rem;
      transition: background 0.15s;
    }
    .dj-tab:hover, .dj-tab.active { background: #30363d; border-color: #58a6ff; color: #58a6ff; }

    .toggle-switch { position: relative; display: inline-block; width: 44px; height: 24px; }
    .toggle-switch input { opacity: 0; width: 0; height: 0; }
    .toggle-slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
      background: #30363d; border-radius: 24px; transition: 0.2s; }
    .toggle-slider:before { position: absolute; content: ""; height: 18px; width: 18px;
      left: 3px; bottom: 3px; background: #8b949e; border-radius: 50%; transition: 0.2s; }
    .toggle-switch input:checked + .toggle-slider { background: #238636; }
    .toggle-switch input:checked + .toggle-slider:before { transform: translateX(20px); background: #fff; }
    .toggle-label { font-size: 0.78rem; margin-left: 0.3rem; }

    .action-btn {
      padding: 0.3rem 0.7rem; border: 1px solid #30363d; border-radius: 4px;
      background: #21262d; color: #8b949e; cursor: pointer; font-size: 0.8rem; text-decoration: none;
      display: inline-flex; align-items: center; gap: 0.25rem;
    }
    .action-btn:hover { background: #30363d; color: #c9d1d9; }

    .summary-bar {
      display: flex; gap: 2rem; padding: 0.75rem 1rem; margin-bottom: 1rem;
      background: #161b22; border: 1px solid #30363d; border-radius: 8px;
      align-items: center; flex-wrap: wrap;
    }
    .summary-stat { font-size: 0.9rem; }
    .summary-stat strong { color: #58a6ff; }

    .row-archived { opacity: 0.45; }
    .row-archived:hover { opacity: 0.7; }

    .player-bar {
      position: fixed; bottom: 0; left: 0; right: 0; background: #161b22;
      border-top: 1px solid #30363d; padding: 0.75rem 1.5rem;
      display: flex; align-items: center; gap: 1rem; z-index: 10;
    }
    .player-bar audio { flex: 1; max-width: 600px; height: 32px; }
    .player-bar .now-playing { font-size: 0.85rem; color: #8b949e; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 300px; }
    .player-bar.hidden { display: none; }
    .player-close { cursor: pointer; color: #8b949e; font-size: 1.2rem; }
    .player-close:hover { color: #f85149; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🎧 DJ Library</h1>
      <div class="header-actions">
        <a href="/" class="action-btn">📻 Uploader</a>
      </div>
    </header>

    <div class="dj-tabs">
      <a href="/library" class="dj-tab {% if not dj_filter %}active{% endif %}">All DJs</a>
      {% for dj in ["ankd", "mctoastus", "momo"] %}
      <a href="/library?dj={{ dj }}" class="dj-tab {% if dj_filter == dj %}active{% endif %}">{{ dj }}</a>
      {% endfor %}
    </div>

    <div class="summary-bar">
      <span class="summary-stat">Sets: <strong id="stat-total">—</strong></span>
      <span class="summary-stat">In rotation: <strong id="stat-active">—</strong></span>
      <span class="summary-stat">Archived: <strong id="stat-archived">—</strong></span>
      <span style="flex:1"></span>
      <button class="action-btn" onclick="syncNow()">🔄 Sync Now</button>
    </div>

    <div id="library-table"></div>
  </div>

  <div id="player-bar" class="player-bar hidden">
    <span class="now-playing" id="now-playing">—</span>
    <audio id="audio-player" controls></audio>
    <span class="player-close" onclick="closePlayer()" title="Close player">✕</span>
  </div>

  <script>
    let files = [];
    const djFilter = "{{ dj_filter }}";

    async function loadLibrary() {
      const url = djFilter ? `/api/library?dj=${djFilter}` : '/api/library';
      const resp = await fetch(url);
      const data = await resp.json();
      if (data.error) { document.getElementById('library-table').innerHTML = `<p class="error">${data.error}</p>`; return; }
      files = data.files;
      renderTable();
    }

    function renderTable() {
      const active = files.filter(f => f.in_rotation).length;
      const archived = files.length - active;
      document.getElementById('stat-total').textContent = files.length;
      document.getElementById('stat-active').textContent = active;
      document.getElementById('stat-archived').textContent = archived;

      let html = `<table class="data-table">
        <thead><tr>
          <th class="col-sel">🔊</th>
          <th class="col-title">Title</th>
          <th class="col-streamer">DJ</th>
          <th class="col-dur">Duration</th>
          <th class="col-date">Date</th>
          <th class="col-sel">Rotation</th>
          <th class="col-sel">Play</th>
          <th class="col-sel">DL</th>
        </tr></thead><tbody>`;

      for (const f of files) {
        const rowClass = f.in_rotation ? '' : 'row-archived';
        const checked = f.in_rotation ? 'checked' : '';
        const date = new Date(f.mtime * 1000).toLocaleDateString('de-DE', {day:'2-digit',month:'2-digit',year:'2-digit'});

        html += `<tr class="${rowClass}">
          <td class="col-sel">${f.in_rotation ? '🟢' : '⚫'}</td>
          <td class="col-title">${esc(f.title)}</td>
          <td class="col-streamer">${esc(f.dj)}</td>
          <td class="col-dur">${f.length_text}</td>
          <td class="col-date">${date}</td>
          <td class="col-sel">
            <label class="toggle-switch">
              <input type="checkbox" ${checked} onchange="toggleFile(${f.id}, this.checked)">
              <span class="toggle-slider"></span>
            </label>
          </td>
          <td class="col-sel">
            <button class="action-btn" onclick="playFile(${f.id}, '${esc(f.title)}')" title="Stream">▶</button>
          </td>
          <td class="col-sel">
            <a class="action-btn" href="/api/library/download/${f.id}" title="Download">⬇</a>
          </td>
        </tr>`;
      }
      html += '</tbody></table>';
      document.getElementById('library-table').innerHTML = html;
    }

    async function toggleFile(fileId, inRotation) {
      const resp = await fetch('/api/library/toggle', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({file_id: fileId, in_rotation: inRotation, toggled_by: 'web-ui'})
      });
      const data = await resp.json();
      if (data.success) {
        // Update local state
        const f = files.find(f => f.id === fileId);
        if (f) f.in_rotation = inRotation;
        renderTable();
      }
    }

    function playFile(fileId, title) {
      const bar = document.getElementById('player-bar');
      const audio = document.getElementById('audio-player');
      const label = document.getElementById('now-playing');
      bar.classList.remove('hidden');
      label.textContent = title;
      audio.src = `/api/library/stream/${fileId}`;
      audio.play();
    }

    function closePlayer() {
      const audio = document.getElementById('audio-player');
      audio.pause();
      audio.src = '';
      document.getElementById('player-bar').classList.add('hidden');
    }

    async function syncNow() {
      const btn = event.target;
      btn.textContent = '⏳ Syncing...';
      const resp = await fetch('/api/library/sync', {method:'POST'});
      const data = await resp.json();
      btn.textContent = `🔄 Synced: ${data.synced} ok, ${data.errors} err`;
      setTimeout(() => { btn.textContent = '🔄 Sync Now'; }, 3000);
    }

    function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

    loadLibrary();
  </script>
</body>
</html>
