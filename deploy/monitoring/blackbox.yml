# radio zukka v2 — blackbox-exporter module config (Issue #44, §3.8).
#
# Two modules: `http_2xx` for liveness probes and `https_cert` for TLS expiry
# (feeds `ZukkaCertExpiry` via `probe_ssl_earliest_cert_expiry`). Merged into
# the shared blackbox-exporter config by the host owner (§2.11).

modules:
  http_2xx:
    prober: http
    timeout: 5s
    http:
      method: GET
      valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
      valid_status_codes: [200]
      preferred_ip_protocol: ip4

  https_cert:
    prober: http
    timeout: 5s
    http:
      method: GET
      valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
      valid_status_codes: [200]
      preferred_ip_protocol: ip4
      tls_config:
        insecure_skip_verify: false
